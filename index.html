<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>กินดี</title>
  <meta name="theme-color" content="#f6f5f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="กินดี" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="เมนูหลัก">
    <div class="tabs">
      <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="tabHome"></span></button>
      <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V6M19 20v-9"/></svg><span data-i18n="tabProgress"></span></button>
      <button class="tab" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i18n="tabProfile"></span></button>
    </div>
    <button class="fab" id="fab" aria-label="เพิ่มอาหาร"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>

  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden />
  <input type="file" id="file-gallery" accept="image/*" hidden />
  <input type="file" id="file-import" accept="application/json" hidden />

  <script type="module" src="app.js"></script>
</body>
</html>
